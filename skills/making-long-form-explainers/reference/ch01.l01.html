      // sky: Earth limb, faint second orbit, six satellites, one-way lines, pulses, the phone on the ground
      var sky = document.getElementById("ch01-skysvg");
      put("ch01-skysvg", 960, 892, 1, D.earth("ch01-earth", { r: 2400 }));
      sky.insertAdjacentHTML("beforeend", '<g id="ch01-orbits" fill="none" class="s-ink2" stroke-width="3" stroke-dasharray="12 14"><path d="M-80 470 Q960 150 2000 470"/><path d="M-80 300 Q960 60 2000 380"/></g>');

        SAT.push([x, y]);
        sky.insertAdjacentHTML("beforeend", '<path id="ch01-ln' + i + '" d="M' + x + ' ' + (y + 40) + ' L ' + (960 + (x - 960) * 0.06) + ' 850" class="flowline" marker-end="url(#ch01-arrow)"/>');

      sky.insertAdjacentHTML("beforeend", '<g id="ch01-dim" class="s-accent" stroke-width="6" stroke-linecap="round"><path data-len="460" d="M1790 880 V 420"/><path d="M1766 880 H1814 M1766 420 H1814"/></g>');
      // scene 5: the map again, with a dimming layer under the dot

      // Pull-up (on "The satellites"): the phone shrinks to a point on the Earth's edge while the sky arrives.
      var PU = T(5.2);

      tl.fromTo("#ch01-mkg", { opacity: 0 }, { opacity: 1, duration: 0.3 }, PU + 0.9);
      SAT.forEach(function (p, i) {
        tl.fromTo("#ch01-satg" + i, { y: -520 }, { y: 0, duration: 1.1, ease: "power3.out" }, PU + 0.25 + i * 0.06);

      gsap.set("#ch01-orbits", { opacity: 0 });
      K.enter("#ch01-t-oneway", T(6.4), { y: 12, duration: 0.35 });

      // Beat 1.3: numbers. Dimension line, then tags one per phrase; satellites drift along the arc.
      K.draw("#ch01-dim path:first-child", T(12.9), 0.6);
      tl.from("#ch01-dim path:last-child", { opacity: 0, duration: 0.2 }, T(13.4));

      tl.to("#ch01-orbits", { opacity: 1, duration: 0.6 }, T(16.0));
      K.enter("#ch01-t-orbits", T(17.6), { y: 12, duration: 0.35 });
      SAT.forEach(function (p, i) { tl.to("#ch01-satg" + i, { x: 34, duration: 16, ease: "none" }, T(9.0)); });

      // Beat 1.4: pulses sweep down the lines like a lighthouse; then the zoom to the phone, which only receives.
      [T(18.8), T(21.6), T(24.4)].forEach(function (c0) {
        SAT.forEach(function (p, i) {
          var t0 = c0 + i * 0.32, ex = 960 + (p[0] - 960) * 0.06;

      gsap.set("#ch01-s5", { visibility: "hidden" });

      tl.to("#ch01-p5-body", { opacity: 0.35, duration: 0.5 }, T(31.5));

      tl.fromTo("#ch01-q-m", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.35, ease: "expo.out" }, T(33.1));

      tl.to("#ch01-q", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, T(35.75));
      tl.to("#ch01-s5", { y: 1000, duration: 1.1, ease: "power3.inOut" }, T(35.85));
      gsap.set("#ch01-end", { visibility: "hidden" });
      tl.set("#ch01-end", { visibility: "hidden" }, 0);
      tl.set("#ch01-end", { visibility: "visible" }, T(35.85));
      tl.fromTo("#ch01-esg", { y: -640 }, { y: 0, duration: 1.2, ease: "power3.out" }, T(36.0));

      gsap.set("#ch01-wipe", { yPercent: 102 });
      K.end(DUR);
      window.__timelines["ch01"] = tl;
    })();
    </script>
